name: Note に下書きを作成

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "ブログファイル名 (例: 2026-05-26「タイトル」.md)"
        required: true
        type: string
      title:
        description: "記事タイトル"
        required: true
        type: string
      cover_image:
        description: "カバー画像ファイル名 (例: 2026-05-26.png)"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: publisher/package-lock.json

      - name: Install publisher dependencies
        run: npm ci
        working-directory: publisher

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: publisher

      # 記事は下書きとしてNote.comに保存されるのみで、公開（投稿する操作）は行わない。
      # 公開は山下がnote.com UI から手動で行う運用のため、
      # frontmatterのpublished_url/2_published更新もここでは行わない（公開後に別途更新する）。
      - name: Create draft on Note
        id: publish
        run: node publish-note.js "${{ inputs.filename }}"
        working-directory: publisher
        env:
          NOTE_SESSION: ${{ secrets.NOTE_SESSION }}
          BLOG_DIR: ${{ github.workspace }}/blog
          COVER_IMAGE: ${{ inputs.cover_image && format('{0}/blog/images/{1}', github.workspace, inputs.cover_image) || '' }}

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-screenshots
          path: |
            ${{ github.workspace }}/note-login.png
            ${{ github.workspace }}/note-login-failed.png
            ${{ github.workspace }}/note-after-login-click.png
            ${{ github.workspace }}/note-before-publish.png
            ${{ github.workspace }}/note-debug.png
          if-no-files-found: ignore
