name: Note に記事を投稿

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "ブログファイル名 (例: 2026-05-26「タイトル」.md)"
        required: true
        type: string
      title:
        description: "記事タイトル"
        required: true
        type: string
      cover_image:
        description: "カバー画像ファイル名 (例: 2026-05-26.png)"
        required: false
        type: string
      scheduled_at:
        description: "予約投稿日時 (ISO 8601形式: 2026-06-01T07:00:00+09:00)"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: publisher/package-lock.json

      - name: Install publisher dependencies
        run: npm ci
        working-directory: publisher

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: publisher

      - name: Publish to Note
        id: publish
        run: node publish-note.js "${{ inputs.filename }}"
        working-directory: publisher
        env:
          NOTE_SESSION: ${{ secrets.NOTE_SESSION }}
          BLOG_DIR: ${{ github.workspace }}/blog
          COVER_IMAGE: ${{ inputs.cover_image && format('{0}/blog/images/{1}', github.workspace, inputs.cover_image) || '' }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}

      - name: Update blog frontmatter
        if: steps.publish.outputs.note_url != ''
        run: |
          node update-frontmatter.js "${{ inputs.filename }}" "${{ steps.publish.outputs.note_url }}"
        working-directory: publisher
        env:
          BLOG_DIR: ${{ github.workspace }}/blog

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-screenshots
          path: |
            ${{ github.workspace }}/note-login.png
            ${{ github.workspace }}/note-login-failed.png
            ${{ github.workspace }}/note-after-login-click.png
            ${{ github.workspace }}/note-before-publish.png
            ${{ github.workspace }}/note-debug.png
          if-no-files-found: ignore

      - name: Commit frontmatter update
        if: steps.publish.outputs.note_url != ''
        run: |
          git config user.name "川上"
          git config user.email "contact@keyaki-dev.com"
          git add "blog/${{ inputs.filename }}"
          git commit -m "content: ${{ inputs.title }} を Note に投稿"
          git push
