<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: cream rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="#FFF8F0"/>

  <!-- Subtle soft glow behind icon -->
  <ellipse cx="256" cy="270" rx="160" ry="150" fill="#F5CBA7" opacity="0.18"/>

  <!-- Fork tines — 3 branches representing idea divergence -->
  <!-- Left tine -->
  <line x1="160" y1="120" x2="160" y2="265" stroke="#F1948A" stroke-width="30" stroke-linecap="round"/>
  <!-- Center tine -->
  <line x1="256" y1="100" x2="256" y2="265" stroke="#AED6F1" stroke-width="30" stroke-linecap="round"/>
  <!-- Right tine -->
  <line x1="352" y1="120" x2="352" y2="265" stroke="#F5CBA7" stroke-width="30" stroke-linecap="round"/>

  <!-- Tine tips (rounded caps as circles for polish) -->
  <circle cx="160" cy="108" r="18" fill="#F1948A"/>
  <circle cx="256" cy="88"  r="18" fill="#AED6F1"/>
  <circle cx="352" cy="108" r="18" fill="#F5CBA7"/>

  <!-- Collar / junction — where tines meet the handle -->
  <path d="
    M 128 265
    Q 128 295 256 300
    Q 384 295 384 265
    L 384 265
    Q 384 285 256 292
    Q 128 285 128 265
    Z
  " fill="#F1948A" opacity="0"/>

  <!-- Converging curves from outer tines to trunk -->
  <path d="M 160 265 Q 160 310 256 320" stroke="#F1948A" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M 352 265 Q 352 310 256 320" stroke="#F5CBA7" stroke-width="30" fill="none" stroke-linecap="round"/>
  <!-- Center tine straight down to junction -->
  <line x1="256" y1="265" x2="256" y2="320" stroke="#AED6F1" stroke-width="30" stroke-linecap="round"/>

  <!-- Trunk / handle — single unified path going down -->
  <rect x="234" y="316" width="44" height="112" rx="22" fill="#F1948A"/>

  <!-- Root node — base of fork handle -->
  <circle cx="256" cy="432" r="26" fill="#F1948A"/>
  <circle cx="256" cy="432" r="16" fill="#FFF8F0"/>
  <circle cx="256" cy="432" r="8"  fill="#F1948A"/>

  <!-- Subtle fork-tip glow dots -->
  <circle cx="160" cy="108" r="6" fill="#FFF8F0" opacity="0.7"/>
  <circle cx="256" cy="88"  r="6" fill="#FFF8F0" opacity="0.7"/>
  <circle cx="352" cy="108" r="6" fill="#FFF8F0" opacity="0.7"/>
</svg>
